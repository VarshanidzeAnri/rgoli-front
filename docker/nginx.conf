# Production: one Nginx serves the SPA and forwards /api and /storage to Laravel.
# The API container ("api") runs php-fpm on :9000 with code at /var/www/api.
server {
    listen 80;
    server_name _;
    client_max_body_size 128m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed assets: cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Laravel: API, public storage (avatars), API docs.
    location ~ ^/(api|storage|docs)(/|$) {
        root /var/www/api/public;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        root /var/www/api/public;
        fastcgi_pass api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/api/public;
        fastcgi_read_timeout 120;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
