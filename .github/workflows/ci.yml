name: Frontend CI

on:
  push:
  pull_request:

concurrency:
  group: front-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ESLint · tsc · i18n · Vitest · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:i18n
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: Playwright (main only)
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rgoli
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with: { path: rgoli-front }
      # The API lives in its own repository; set the RGOLI_API_REPO variable (owner/name).
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.RGOLI_API_REPO }}
          path: rgoli-api
          token: ${{ secrets.API_REPO_TOKEN || github.token }}
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'bcmath, intl, gd, zip, pdo_mysql' }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: rgoli-front/package-lock.json }
      - name: Start API
        working-directory: rgoli-api
        env: { DB_CONNECTION: mysql, DB_HOST: 127.0.0.1, DB_DATABASE: rgoli, DB_USERNAME: root, DB_PASSWORD: root, APP_DEMO: 'true', QUEUE_CONNECTION: sync }
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env && php artisan key:generate
          php artisan migrate --seed --force
          php artisan serve --port=8000 > /tmp/api.log 2>&1 &
      - name: Playwright
        working-directory: rgoli-front
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: rgoli-front/playwright-report }
