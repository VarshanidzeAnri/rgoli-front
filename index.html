<!doctype html>
<html lang="ka" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050d10" />
    <title>RGOLI ZEROFRAME OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=JetBrains+Mono:wght@300..700&family=Noto+Sans+Georgian:wght@300..800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint (no flash).
      try {
        var t = localStorage.getItem('rgoli.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        var l = localStorage.getItem('rgoli.locale')
        if (l === 'ka' || l === 'en' || l === 'ru') document.documentElement.lang = l
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
